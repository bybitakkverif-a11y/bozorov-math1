
name: Build Bozorov OMR APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify project files
        run: |
          echo "Checking repository files..."
          pwd
          ls -la
          test -f main.py || {
            echo "ERROR: main.py not found in repository root"
            exit 1
          }
          test -f requirements.txt || {
            echo "ERROR: requirements.txt not found"
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk \
            --module-name main \
            --org uz.bozorovmath \
            --project "Bozorov OMR" \
            --description "Bozorov Math Milliy Sertifikat Skaneri"

      - name: Locate APK
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bozorov-OMR-APK
          path: build/**/*.apk
          if-no-files-found: error
